name: Deploy

# Manual only until the first production deploy has been verified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, fileinfo, gd, intl
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Test before deploying
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Build assets
        run: |
          npm ci --ignore-scripts
          npm run build

      # Maintenance files go up first so visitors never hit half-uploaded code.
      # deploy:finish (run by cron on the server) removes them after migrating.
      - name: Prepare maintenance files
        run: |
          php artisan down --retry=60
          mkdir -p maintenance
          mv storage/framework/down storage/framework/maintenance.php maintenance/

      - name: Build release
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          mkdir release
          cp -r app artisan bootstrap composer.json composer.lock config database lang public resources routes vendor release/
          rm -rf release/public/hot release/public/storage release/resources/css release/resources/js
          find release/bootstrap/cache -type f ! -name .gitignore -delete
          # Only the directory skeleton; logs, sessions and uploads stay on the server.
          (cd storage && find . -name .gitignore ! -path './framework/testing/*' -exec install -D -m 644 {} ../release/storage/{} \;)
          rm -f release/database/database.sqlite
          echo "${GITHUB_SHA}" > release/bootstrap/deploy-id

      - name: Enter maintenance mode
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_PORT: ${{ vars.FTPS_PORT || '2121' }}
          FTPS_APP_PATH: ${{ vars.FTPS_APP_PATH || 'laravel/' }}
        run: |
          for file in down maintenance.php; do
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
              --user "${FTPS_USERNAME}:${FTPS_PASSWORD}" \
              -T "maintenance/${file}" \
              "ftp://${FTPS_HOST}:${FTPS_PORT}/${FTPS_APP_PATH}storage/framework/${file}"
          done

      - name: Install lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      # lftp sends SNI, so the host returns the d51cons.com certificate; it is verified strictly.
      # Code directories are mirrored with --delete; vendor/ compares by size because CI file
      # times change on every run. Server-only files (.env, storage data, caches) are never
      # part of a mirror with --delete. deploy-id goes last so deploy:finish only starts after
      # every file is in place.
      - name: Upload release
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          FTPS_PORT: ${{ vars.FTPS_PORT || '2121' }}
          FTPS_APP_PATH: ${{ vars.FTPS_APP_PATH || 'laravel/' }}
        run: |
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ssl:verify-certificate true"
            echo "set ssl:check-hostname true"
            echo "set ftp:passive-mode true"
            echo "set net:max-retries 3"
            echo "set net:timeout 60"
            echo "set cmd:fail-exit true"
            echo "open -u \"${FTPS_USERNAME}\" --env-password -p ${FTPS_PORT} ftp://${FTPS_HOST}"
            echo "mkdir -p -f ${FTPS_APP_PATH}"
            echo "cd ${FTPS_APP_PATH}"
            echo "mirror -R --delete --ignore-time --no-perms --parallel=4 release/vendor vendor"
            for dir in app config database lang resources routes public/build; do
              echo "mirror -R --delete --no-perms --parallel=4 release/${dir} ${dir}"
            done
            echo "mirror -R --no-perms --exclude-glob cache/*.php --exclude-glob deploy-id release/bootstrap bootstrap"
            echo "mirror -R --no-perms release/storage storage"
            echo "mirror -R --no-perms --exclude build/ --exclude storage release/public public"
            echo "put -O . release/artisan release/composer.json release/composer.lock"
            echo "put -O bootstrap release/bootstrap/deploy-id"
            echo "bye"
          } > upload.lftp
          lftp -f upload.lftp

      - name: Next step
        run: echo "Uploaded ${GITHUB_SHA}. Cron runs deploy:finish within a minute to migrate and leave maintenance mode."
